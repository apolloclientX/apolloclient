<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Client</title>
    <style>
        /* --- ROOT VARIABLES & RESET --- */
        :root {
            --cyan-glow: #00f0ff;
            --ice-blue: #70d6ff;
            --deep-navy: #050b14;
            --glass-bg: rgba(10, 25, 47, 0.55);
            --glass-border: rgba(0, 240, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, var(--deep-navy) 100%);
            color: #ffffff;
        }

        /* --- BACKGROUND CANVAS FOR PARTICLES --- */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- MAIN WRAPPER & CONTAINER --- */
        .launcher-ui {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
        }

        /* --- TOP HEADER & BRANDING --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo .icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00f0ff, #0040ff);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--cyan-glow);
            font-weight: 900;
            font-size: 18px;
        }

        .brand-logo h1 {
            font-size: 26px;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, var(--ice-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .client-tag {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--ice-blue);
            backdrop-filter: blur(10px);
        }

        /* --- CENTER AREA (MENU & GAME CONTAINER) --- */
        .content-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 140px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Launch Menu Box */
        .menu-container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6),
                        inset 0 0 15px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .menu-container.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }

        .menu-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .menu-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
            color: var(--cyan-glow);
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn.primary {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(0, 80, 255, 0.3));
            border-color: var(--cyan-glow);
        }

        /* Game Box Display */
        .game-viewport {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .game-viewport.active {
            display: block;
            opacity: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- FOOTER STATUS --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            height: 30px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--cyan-glow);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .close-game-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }

        .close-game-btn:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Particle Background Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main UI Framework -->
    <div class="launcher-ui">
        <header>
            <div class="brand-logo">
                <div class="icon">❖</div>
                <h1>Apollo</h1>
            </div>
            <div class="client-tag">v1.12.2 EDITION</div>
        </header>

        <main class="content-area">
            <!-- Launcher Menu -->
            <div class="menu-container" id="menu-box">
                <button class="menu-btn primary" id="play-btn">Launch Game</button>
                <button class="menu-btn">Server List</button>
                <button class="menu-btn">Settings</button>
                <button class="menu-btn">Mods & Visuals</button>
            </div>

            <!-- In-Page Game Box Viewport -->
            <div class="game-viewport" id="game-box">
                <iframe id="game-frame" src="about:blank"></iframe>
            </div>
        </main>

        <footer>
            <div><span class="status-dot" id="status-indicator"></span><span id="status-text">Client Engine Ready</span></div>
            <button class="close-game-btn" id="close-btn">Return to Menu</button>
            <div>Apollo Web Framework</div>
        </footer>
    </div>

    <!-- JavaScript Engine & Actions -->
    <script>
        // --- BACKGROUND PARTICLES ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = Array.from({ length: 80 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 3 + 1,
            speedY: Math.random() * 1 + 0.5,
            speedX: Math.random() * 0.5 - 0.25,
            opacity: Math.random() * 0.7 + 0.3
        }));

        function renderParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(112, 214, 255, ${p.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.fill();

                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y > height) { p.y = -5; p.x = Math.random() * width; }
                if (p.x > width) p.x = 0;
                if (p.x < 0) p.x = width;
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // --- GAME LAUNCHING & VIEWPORT CONTROLS ---
        const playBtn = document.getElementById('play-btn');
        const closeBtn = document.getElementById('close-btn');
        const menuBox = document.getElementById('menu-box');
        const gameBox = document.getElementById('game-box');
        const gameFrame = document.getElementById('game-frame');
        const statusText = document.getElementById('status-text');

        // Main Target URL for Client Entry Point
        const CLIENT_URL = "https://eaglercraft.q13x.com/1.12.2/";

        playBtn.addEventListener('click', () => {
            // Hide menu and display viewport box
            menuBox.classList.add('hidden');
            gameBox.classList.add('active');
            closeBtn.style.display = 'block';
            statusText.innerText = "Game Running inside Apollo Frame";

            // Inject client URL into iframe
            if (gameFrame.src === "about:blank") {
                gameFrame.src = CLIENT_URL;
            }
        });

        closeBtn.addEventListener('click', () => {
            // Return to main menu screen
            gameBox.classList.remove('active');
            menuBox.classList.remove('hidden');
            closeBtn.style.display = 'none';
            statusText.innerText = "Client Engine Ready";
        });
    </script>
</body>
</html>
